name: Build jq

on:
  workflow_dispatch:
    inputs:
      archs:
        description: 'Space-separated arch list (blank = script default)'
        required: false
        default: ''
      compiler:
        description: 'Toolchain to build (blank = all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - gcc
          - clang
          - gnu

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, gnu]
        exclude:
          - compiler: ${{ (github.event.inputs.compiler != '' && github.event.inputs.compiler != 'gcc')   && 'gcc'   || '' }}
          - compiler: ${{ (github.event.inputs.compiler != '' && github.event.inputs.compiler != 'clang') && 'clang' || '' }}
          - compiler: ${{ (github.event.inputs.compiler != '' && github.event.inputs.compiler != 'gnu')   && 'gnu'   || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-jq-${{ runner.os }}-${{ hashFiles('.github/workflows/jq.yml') }}
          restore-keys: apt-jq-${{ runner.os }}-

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool

      - name: Cache toolchain downloads
        uses: actions/cache@v4
        with:
          path: toolchains/${{ matrix.compiler }}
          key: toolchain-jq-${{ matrix.compiler }}-${{ hashFiles('common.sh') }}
          restore-keys: |
            toolchain-jq-${{ matrix.compiler }}-
            toolchain-${{ matrix.compiler }}-

      - name: Build (${{ matrix.compiler }})
        env:
          ARCHS_INPUT: ${{ github.event.inputs.archs }}
        run: |
          chmod +x ./build-jq.sh
          ARGS=(--${{ matrix.compiler }} -j "$(nproc)")
          [[ -n "${ARCHS_INPUT:-}" ]] && ARGS+=(--arch "${ARCHS_INPUT}")
          ./build-jq.sh "${ARGS[@]}"

      - name: Upload built binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jq-${{ matrix.compiler }}
          path: output/jq/${{ matrix.compiler }}/
          if-no-files-found: error
          retention-days: 30
