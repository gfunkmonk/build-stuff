name: Build 7zz

on:
  workflow_dispatch:
    inputs:
      archs:
        description: 'Space-separated arch list (blank = script default)'
        required: false
        default: ''
      compiler:
        description: 'Toolchain to build (blank = all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - gcc
          - clang
          - gnu

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, gnu]
        exclude:
          - compiler: ${{ (github.event.inputs.compiler != '' && github.event.inputs.compiler != 'gcc')   && 'gcc'   || '' }}
          - compiler: ${{ (github.event.inputs.compiler != '' && github.event.inputs.compiler != 'clang') && 'clang' || '' }}
          - compiler: ${{ (github.event.inputs.compiler != '' && github.event.inputs.compiler != 'gnu')   && 'gnu'   || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache toolchain downloads
        uses: actions/cache@v4
        with:
          path: toolchains/${{ matrix.compiler }}
          key: toolchain-7zz-${{ matrix.compiler }}-${{ hashFiles('common.sh') }}
          restore-keys: |
            toolchain-7zz-${{ matrix.compiler }}-
            toolchain-${{ matrix.compiler }}-

      - name: Build (${{ matrix.compiler }})
        env:
          ARCHS_INPUT: ${{ github.event.inputs.archs }}
        run: |
          chmod +x ./build-7zz.sh
          ARGS=(--${{ matrix.compiler }} -j "$(nproc)")
          [[ -n "${ARCHS_INPUT:-}" ]] && ARGS+=(--arch "${ARCHS_INPUT}")
          ./build-7zz.sh "${ARGS[@]}"

      - name: Upload built binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7zz-${{ matrix.compiler }}
          path: output/7zz/${{ matrix.compiler }}/
          if-no-files-found: error
          retention-days: 30
